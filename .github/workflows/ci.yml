name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore MqBench.sln

      - name: Build
        run: dotnet build MqBench.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MqBench.sln --no-build --configuration Release --verbosity normal
