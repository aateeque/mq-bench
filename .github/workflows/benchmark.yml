name: Run Benchmark

on:
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - concurrent
          - publisher
          - pull-subscriber
          - push-subscriber
      message_count:
        description: 'Number of messages'
        required: true
        default: '100000'
        type: string
      message_size:
        description: 'Message size in bytes'
        required: true
        default: '1024'
        type: string
      concurrency:
        description: 'Concurrency level'
        required: true
        default: '10'
        type: string
      duration_seconds:
        description: 'Test duration (seconds, for subscribers)'
        required: true
        default: '300'
        type: string
      stress_profile:
        description: 'Stress test profile'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - small
          - medium
          - large
          - xlarge
          - large-payload
      burst_mode:
        description: 'Enable burst mode'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      burst_size:
        description: 'Messages per burst'
        required: false
        default: '1000'
        type: string
      burst_interval_ms:
        description: 'Interval between bursts (ms)'
        required: false
        default: '100'
        type: string
      enable_message_tracking:
        description: 'Track message loss'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'mq-bench' }}
  GCP_REGION: us-central1
  GKE_CLUSTER: mq-bench-gke
  NAMESPACE: mq-bench

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Run Concurrent Benchmark
        if: ${{ inputs.benchmark_type == 'concurrent' }}
        run: |
          echo "🚀 Starting Concurrent Publisher + Pull Subscriber Benchmark"
          echo "Messages: ${{ inputs.message_count }}, Size: ${{ inputs.message_size }}B, Concurrency: ${{ inputs.concurrency }}"
          echo "This mode runs both simultaneously for accurate end-to-end latency measurement"

          # Cleanup existing jobs
          kubectl delete job benchmark-concurrent-subscriber -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl delete job benchmark-concurrent-publisher -n ${{ env.NAMESPACE }} --ignore-not-found

          # 1. Start subscriber FIRST (it will wait for messages)
          echo "📥 Starting Pull Subscriber..."
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: benchmark-concurrent-subscriber
            namespace: ${{ env.NAMESPACE }}
            labels:
              benchmark.config/mode: "concurrent"
              benchmark.config/message_count: "${{ inputs.message_count }}"
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: benchmark-concurrent-subscriber
                  tags.datadoghq.com/env: prod
                  tags.datadoghq.com/service: mq-bench-pull-subscriber
                  tags.datadoghq.com/version: "${{ github.sha }}"
              spec:
                serviceAccountName: benchmark-sa
                restartPolicy: Never
                containers:
                - name: pull-subscriber
                  image: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/mq-bench/pull-subscriber:latest
                  env:
                  - name: GCP_PROJECT_ID
                    value: "${{ env.GCP_PROJECT_ID }}"
                  - name: PUBSUB_SUBSCRIPTION
                    value: "mq-bench-pull-subscription"
                  - name: MESSAGE_COUNT
                    value: "${{ inputs.message_count }}"
                  - name: TEST_DURATION_SECONDS
                    value: "${{ inputs.duration_seconds }}"
                  - name: DD_AGENT_HOST
                    value: "datadog-agent.mq-bench.svc.cluster.local"
                  - name: DD_DOGSTATSD_PORT
                    value: "8125"
                  - name: DD_ENABLED
                    value: "true"
                  - name: ENABLE_MESSAGE_TRACKING
                    value: "${{ inputs.enable_message_tracking }}"
                  - name: STRESS_PROFILE
                    value: "${{ inputs.stress_profile }}"
                  - name: DD_ENV
                    value: "prod"
                  - name: DD_SERVICE
                    value: "mq-bench-pull-subscriber"
                  - name: DD_VERSION
                    value: "${{ github.sha }}"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "2Gi"
                      cpu: "2000m"
          EOF

          # 2. Wait for subscriber pod to be ready
          echo "⏳ Waiting for subscriber to be ready..."
          kubectl wait --for=condition=Ready pod -l app=benchmark-concurrent-subscriber -n ${{ env.NAMESPACE }} --timeout=120s
          sleep 5  # Extra buffer for Pub/Sub connection to establish

          # 3. Start publisher
          echo "📤 Starting Publisher..."
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: benchmark-concurrent-publisher
            namespace: ${{ env.NAMESPACE }}
            labels:
              benchmark.config/mode: "concurrent"
              benchmark.config/message_count: "${{ inputs.message_count }}"
              benchmark.config/message_size: "${{ inputs.message_size }}"
              benchmark.config/concurrency: "${{ inputs.concurrency }}"
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: benchmark-concurrent-publisher
                  tags.datadoghq.com/env: prod
                  tags.datadoghq.com/service: mq-bench-publisher
                  tags.datadoghq.com/version: "${{ github.sha }}"
              spec:
                serviceAccountName: benchmark-sa
                restartPolicy: Never
                containers:
                - name: publisher
                  image: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/mq-bench/publisher:latest
                  env:
                  - name: GCP_PROJECT_ID
                    value: "${{ env.GCP_PROJECT_ID }}"
                  - name: PUBSUB_TOPIC
                    value: "mq-bench-topic"
                  - name: MESSAGE_COUNT
                    value: "${{ inputs.message_count }}"
                  - name: MESSAGE_SIZE_BYTES
                    value: "${{ inputs.message_size }}"
                  - name: CONCURRENCY_LEVEL
                    value: "${{ inputs.concurrency }}"
                  - name: DD_AGENT_HOST
                    value: "datadog-agent.mq-bench.svc.cluster.local"
                  - name: DD_DOGSTATSD_PORT
                    value: "8125"
                  - name: DD_ENABLED
                    value: "true"
                  - name: ENABLE_MESSAGE_TRACKING
                    value: "${{ inputs.enable_message_tracking }}"
                  - name: STRESS_PROFILE
                    value: "${{ inputs.stress_profile }}"
                  - name: BURST_MODE
                    value: "${{ inputs.burst_mode }}"
                  - name: BURST_SIZE
                    value: "${{ inputs.burst_size }}"
                  - name: BURST_INTERVAL_MS
                    value: "${{ inputs.burst_interval_ms }}"
                  - name: DD_ENV
                    value: "prod"
                  - name: DD_SERVICE
                    value: "mq-bench-publisher"
                  - name: DD_VERSION
                    value: "${{ github.sha }}"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "2Gi"
                      cpu: "2000m"
          EOF

          # 4. Wait for publisher to complete
          echo "⏳ Waiting for publisher to complete..."
          if ! kubectl wait --for=condition=complete job/benchmark-concurrent-publisher -n ${{ env.NAMESPACE }} --timeout=600s; then
            echo "❌ Publisher failed or timed out"
            kubectl logs job/benchmark-concurrent-publisher -n ${{ env.NAMESPACE }} || true
            exit 1
          fi

          # 5. Give subscriber time to process any remaining messages
          echo "⏳ Waiting for subscriber to finish processing..."
          sleep 30

          # 6. Wait for subscriber to complete (or timeout gracefully)
          kubectl wait --for=condition=complete job/benchmark-concurrent-subscriber -n ${{ env.NAMESPACE }} --timeout=60s || true

          # 7. Collect results
          echo ""
          echo "============================================"
          echo "📊 PUBLISHER RESULTS"
          echo "============================================"
          kubectl logs job/benchmark-concurrent-publisher -n ${{ env.NAMESPACE }}

          echo ""
          echo "============================================"
          echo "📊 SUBSCRIBER RESULTS (TRUE END-TO-END LATENCY)"
          echo "============================================"
          kubectl logs job/benchmark-concurrent-subscriber -n ${{ env.NAMESPACE }}

      - name: Run Publisher Benchmark
        if: ${{ inputs.benchmark_type == 'all' || inputs.benchmark_type == 'publisher' }}
        run: |
          echo "🚀 Starting Publisher Benchmark"
          echo "Messages: ${{ inputs.message_count }}, Size: ${{ inputs.message_size }}B, Concurrency: ${{ inputs.concurrency }}"

          # Delete existing job if any
          kubectl delete job benchmark-publisher -n ${{ env.NAMESPACE }} --ignore-not-found

          # Create benchmark job
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: benchmark-publisher
            namespace: ${{ env.NAMESPACE }}
            labels:
              benchmark.config/message_count: "${{ inputs.message_count }}"
              benchmark.config/message_size: "${{ inputs.message_size }}"
              benchmark.config/concurrency: "${{ inputs.concurrency }}"
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: benchmark-publisher
                  tags.datadoghq.com/env: prod
                  tags.datadoghq.com/service: mq-bench-publisher
                  tags.datadoghq.com/version: "${{ github.sha }}"
              spec:
                serviceAccountName: benchmark-sa
                restartPolicy: Never
                containers:
                - name: publisher
                  image: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/mq-bench/publisher:latest
                  env:
                  - name: GCP_PROJECT_ID
                    value: "${{ env.GCP_PROJECT_ID }}"
                  - name: PUBSUB_TOPIC
                    value: "mq-bench-topic"
                  - name: MESSAGE_COUNT
                    value: "${{ inputs.message_count }}"
                  - name: MESSAGE_SIZE_BYTES
                    value: "${{ inputs.message_size }}"
                  - name: CONCURRENCY_LEVEL
                    value: "${{ inputs.concurrency }}"
                  - name: DD_AGENT_HOST
                    value: "datadog-agent.mq-bench.svc.cluster.local"
                  - name: DD_DOGSTATSD_PORT
                    value: "8125"
                  - name: DD_ENABLED
                    value: "true"
                  - name: ENABLE_MESSAGE_TRACKING
                    value: "${{ inputs.enable_message_tracking }}"
                  - name: STRESS_PROFILE
                    value: "${{ inputs.stress_profile }}"
                  - name: BURST_MODE
                    value: "${{ inputs.burst_mode }}"
                  - name: BURST_SIZE
                    value: "${{ inputs.burst_size }}"
                  - name: BURST_INTERVAL_MS
                    value: "${{ inputs.burst_interval_ms }}"
                  - name: DD_ENV
                    value: "prod"
                  - name: DD_SERVICE
                    value: "mq-bench-publisher"
                  - name: DD_VERSION
                    value: "${{ github.sha }}"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "2Gi"
                      cpu: "2000m"
          EOF

          # Wait for job to complete (fail workflow if job fails)
          if ! kubectl wait --for=condition=complete job/benchmark-publisher -n ${{ env.NAMESPACE }} --timeout=600s; then
            echo "❌ Publisher benchmark failed or timed out"
            kubectl logs job/benchmark-publisher -n ${{ env.NAMESPACE }} || true
            exit 1
          fi

          echo "📊 Publisher Results:"
          kubectl logs job/benchmark-publisher -n ${{ env.NAMESPACE }}

      - name: Run Pull Subscriber Benchmark
        if: ${{ inputs.benchmark_type == 'all' || inputs.benchmark_type == 'pull-subscriber' }}
        run: |
          echo "🚀 Starting Pull Subscriber Benchmark"

          kubectl delete job benchmark-pull-subscriber -n ${{ env.NAMESPACE }} --ignore-not-found

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: benchmark-pull-subscriber
            namespace: ${{ env.NAMESPACE }}
            labels:
              benchmark.config/message_count: "${{ inputs.message_count }}"
              benchmark.config/duration: "${{ inputs.duration_seconds }}"
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: benchmark-pull-subscriber
                  tags.datadoghq.com/env: prod
                  tags.datadoghq.com/service: mq-bench-pull-subscriber
                  tags.datadoghq.com/version: "${{ github.sha }}"
              spec:
                serviceAccountName: benchmark-sa
                restartPolicy: Never
                containers:
                - name: pull-subscriber
                  image: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/mq-bench/pull-subscriber:latest
                  env:
                  - name: GCP_PROJECT_ID
                    value: "${{ env.GCP_PROJECT_ID }}"
                  - name: PUBSUB_SUBSCRIPTION
                    value: "mq-bench-pull-subscription"
                  - name: MESSAGE_COUNT
                    value: "${{ inputs.message_count }}"
                  - name: TEST_DURATION_SECONDS
                    value: "${{ inputs.duration_seconds }}"
                  - name: DD_AGENT_HOST
                    value: "datadog-agent.mq-bench.svc.cluster.local"
                  - name: DD_DOGSTATSD_PORT
                    value: "8125"
                  - name: DD_ENABLED
                    value: "true"
                  - name: ENABLE_MESSAGE_TRACKING
                    value: "${{ inputs.enable_message_tracking }}"
                  - name: STRESS_PROFILE
                    value: "${{ inputs.stress_profile }}"
                  - name: DD_ENV
                    value: "prod"
                  - name: DD_SERVICE
                    value: "mq-bench-pull-subscriber"
                  - name: DD_VERSION
                    value: "${{ github.sha }}"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "2Gi"
                      cpu: "2000m"
          EOF

          if ! kubectl wait --for=condition=complete job/benchmark-pull-subscriber -n ${{ env.NAMESPACE }} --timeout=600s; then
            echo "❌ Pull subscriber benchmark failed or timed out"
            kubectl logs job/benchmark-pull-subscriber -n ${{ env.NAMESPACE }} || true
            exit 1
          fi

          echo "📊 Pull Subscriber Results:"
          kubectl logs job/benchmark-pull-subscriber -n ${{ env.NAMESPACE }}

      - name: Run Push Subscriber Benchmark
        if: ${{ inputs.benchmark_type == 'all' || inputs.benchmark_type == 'push-subscriber' }}
        env:
          MESSAGE_COUNT: ${{ inputs.message_count }}
          MESSAGE_SIZE: ${{ inputs.message_size }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          ENABLE_TRACKING: ${{ inputs.enable_message_tracking }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "🚀 Starting Push Subscriber Benchmark"
          echo "Note: Push subscriber runs as a deployment, monitoring for ${DURATION_SECONDS}s"

          # Update the deployment with Datadog environment variables
          kubectl set env deployment/mq-bench-push-subscriber -n ${{ env.NAMESPACE }} \
            DD_AGENT_HOST=datadog-agent.mq-bench.svc.cluster.local \
            DD_DOGSTATSD_PORT=8125 \
            DD_ENABLED=true \
            DD_ENV=prod \
            DD_SERVICE=mq-bench-push-subscriber \
            DD_VERSION="${COMMIT_SHA}" \
            ENABLE_MESSAGE_TRACKING="${ENABLE_TRACKING}"

          # Restart to apply new env vars and get fresh metrics
          kubectl rollout restart deployment/mq-bench-push-subscriber -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/mq-bench-push-subscriber -n ${{ env.NAMESPACE }} --timeout=120s

          # Run publisher to generate load for push subscriber
          kubectl delete job benchmark-push-load -n ${{ env.NAMESPACE }} --ignore-not-found

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: benchmark-push-load
            namespace: ${{ env.NAMESPACE }}
            labels:
              benchmark.config/message_count: "${MESSAGE_COUNT}"
              benchmark.config/message_size: "${MESSAGE_SIZE}"
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: benchmark-push-load
                  tags.datadoghq.com/env: prod
                  tags.datadoghq.com/service: mq-bench-publisher
                  tags.datadoghq.com/version: "${COMMIT_SHA}"
              spec:
                serviceAccountName: benchmark-sa
                restartPolicy: Never
                containers:
                - name: publisher
                  image: us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/mq-bench/publisher:latest
                  env:
                  - name: GCP_PROJECT_ID
                    value: "${{ env.GCP_PROJECT_ID }}"
                  - name: PUBSUB_TOPIC
                    value: "mq-bench-topic"
                  - name: MESSAGE_COUNT
                    value: "${MESSAGE_COUNT}"
                  - name: MESSAGE_SIZE_BYTES
                    value: "${MESSAGE_SIZE}"
                  - name: CONCURRENCY_LEVEL
                    value: "${CONCURRENCY}"
                  - name: DD_AGENT_HOST
                    value: "datadog-agent.mq-bench.svc.cluster.local"
                  - name: DD_DOGSTATSD_PORT
                    value: "8125"
                  - name: DD_ENABLED
                    value: "true"
                  - name: DD_ENV
                    value: "prod"
                  - name: DD_SERVICE
                    value: "mq-bench-publisher"
                  - name: DD_VERSION
                    value: "${COMMIT_SHA}"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "2Gi"
                      cpu: "2000m"
          EOF

          if ! kubectl wait --for=condition=complete job/benchmark-push-load -n ${{ env.NAMESPACE }} --timeout=600s; then
            echo "❌ Push load generation failed or timed out"
            kubectl logs job/benchmark-push-load -n ${{ env.NAMESPACE }} || true
            exit 1
          fi

          echo "📊 Push Subscriber Logs (last 100 lines per pod):"
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=mq-bench-push-subscriber -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod ---"
            kubectl logs $pod -n ${{ env.NAMESPACE }} --tail=100
          done

      - name: Summary
        env:
          BENCHMARK_TYPE: ${{ inputs.benchmark_type }}
          MESSAGE_COUNT: ${{ inputs.message_count }}
          MESSAGE_SIZE: ${{ inputs.message_size }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          STRESS_PROFILE: ${{ inputs.stress_profile }}
          BURST_MODE: ${{ inputs.burst_mode }}
          ENABLE_TRACKING: ${{ inputs.enable_message_tracking }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "## Benchmark Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${BENCHMARK_TYPE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Messages | ${MESSAGE_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${MESSAGE_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Concurrency | ${CONCURRENCY} |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION_SECONDS}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Profile | ${STRESS_PROFILE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Burst Mode | ${BURST_MODE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Message Tracking | ${ENABLE_TRACKING} |" >> $GITHUB_STEP_SUMMARY
          echo "| Project | ${{ env.GCP_PROJECT_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Datadog Metrics" >> $GITHUB_STEP_SUMMARY
          echo "Metrics are available in Datadog with tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`env:prod\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`service:mq-bench-*\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`version:${COMMIT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Key metrics: \`mq_bench.throughput.*\`, \`mq_bench.latency.*\`, \`mq_bench.messages.*\`" >> $GITHUB_STEP_SUMMARY
