name: CD

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: mq-bench
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/mq-bench/mq-bench
  GKE_CLUSTER: mq-bench-gke

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push publisher image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/publisher:latest \
            -f src/gcp-pubsub/MqBench.GcpPubSub.Publisher/Dockerfile .
          docker push ${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/publisher:latest

      - name: Build and push pull-subscriber image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/pull-subscriber:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/pull-subscriber:latest \
            -f src/gcp-pubsub/MqBench.GcpPubSub.PullSubscriber/Dockerfile .
          docker push ${{ env.ARTIFACT_REGISTRY }}/pull-subscriber:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/pull-subscriber:latest

      - name: Build and push push-subscriber image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/push-subscriber:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/push-subscriber:latest \
            -f src/gcp-pubsub/MqBench.GcpPubSub.PushSubscriber/Dockerfile .
          docker push ${{ env.ARTIFACT_REGISTRY }}/push-subscriber:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/push-subscriber:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/mq-bench-publisher \
            publisher=${{ env.ARTIFACT_REGISTRY }}/publisher:${{ github.sha }} \
            -n mq-bench
          kubectl set image deployment/mq-bench-pull-subscriber \
            pull-subscriber=${{ env.ARTIFACT_REGISTRY }}/pull-subscriber:${{ github.sha }} \
            -n mq-bench
          kubectl set image deployment/mq-bench-push-subscriber \
            push-subscriber=${{ env.ARTIFACT_REGISTRY }}/push-subscriber:${{ github.sha }} \
            -n mq-bench

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mq-bench-publisher -n mq-bench --timeout=300s
          kubectl rollout status deployment/mq-bench-pull-subscriber -n mq-bench --timeout=300s
          kubectl rollout status deployment/mq-bench-push-subscriber -n mq-bench --timeout=300s
